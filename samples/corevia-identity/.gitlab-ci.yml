# corevia:managed service-cicd.split sha256=073d1d5a546c9f1c82d6392a69d690edf770048d5744684a1319c3be3c82ea40
# Generated by corevia-run (service-cicd.split). CI only: validate, build, lint, security-scan, package.
# CD is a separate Bridge-driven operation (service-artifact.deploy) parameterized by an artifact tag and
# .corevia/cicd/deploy.values.example.yaml. Never add a deploy stage here. Credentials are CI variable references only.
stages:
- validate
- build
- lint
- security-scan
- package
default:
  image: mcr.microsoft.com/dotnet/sdk:9.0
variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
documentation-validate:
  stage: validate
  image: nexus.getcorevia.ir:8083/corevia/bootstrap-installer-ci:1.0.0
  script:
  - ruby .gitlab/ci/validate.rb documentation
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH"
  - if: "$CI_COMMIT_TAG"
version-validate:
  stage: validate
  image: nexus.getcorevia.ir:8083/corevia/bootstrap-installer-ci:1.0.0
  script:
  - git fetch --quiet origin
  - if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
  - '  git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"'
  - '  export COREVIA_VERSION_BASE_REF="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"'
  - elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && ! printf '%s' "$CI_COMMIT_BEFORE_SHA"
    | grep -q '^0\+$'; then
  - '  export COREVIA_VERSION_BASE_REF="$CI_COMMIT_BEFORE_SHA"'
  - else
  - '  export COREVIA_VERSION_BASE_REF="${CI_COMMIT_SHA}^"'
  - fi
  - ruby .gitlab/ci/validate.rb version
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH"
  - if: "$CI_COMMIT_TAG"
tests-validate:
  stage: validate
  script:
  - dotnet restore
  - dotnet test IdentityService.sln --no-restore -c Release --logger "trx" --results-directory
    TestResults
  artifacts:
    when: always
    paths:
    - TestResults/
    expire_in: 1 week
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH"
  - if: "$CI_COMMIT_TAG"
build:
  stage: build
  script:
  - dotnet restore
  - dotnet build --no-restore -c Release
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH"
  - if: "$CI_COMMIT_TAG"
lint:
  stage: lint
  script:
  - dotnet restore
  - dotnet format whitespace IdentityService.sln --no-restore --verify-no-changes
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH"
  - if: "$CI_COMMIT_TAG"
security-scan:
  stage: security-scan
  script:
  - dotnet restore
  - dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
  - '! grep -q "has the following vulnerable packages" vulnerable.txt'
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH"
  - if: "$CI_COMMIT_TAG"
package-container:
  stage: package
  image: docker:27
  services:
  - docker:27-dind
  script:
  - if [ -n "$CI_COMMIT_TAG" ]; then ARTIFACT_TAG="${CI_COMMIT_TAG#v}"; else echo
    "package requires a git tag (immutable version source)"; exit 1; fi
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" registry.gitlab.getcorevia.ir
  - if docker manifest inspect registry.gitlab.getcorevia.ir/corevia/corevia-identity:$ARTIFACT_TAG
    >/dev/null 2>&1; then echo "tag $ARTIFACT_TAG already exists; artifacts are immutable";
    exit 1; fi
  - docker buildx build --secret id=nuget_config,src="$NUGET_CONFIG" -f IdentityService.Api/Dockerfile
    -t registry.gitlab.getcorevia.ir/corevia/corevia-identity:$ARTIFACT_TAG --load
    .
  - docker push registry.gitlab.getcorevia.ir/corevia/corevia-identity:$ARTIFACT_TAG
  rules:
  - if: "$CI_COMMIT_TAG"
