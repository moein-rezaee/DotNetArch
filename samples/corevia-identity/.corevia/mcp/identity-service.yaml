    - { apiPermission: Identity.Tenants.Read, mcpPermission: identity.mcp.tenants.read, action: read, resource: tenants, audience: admin, risk: read, approvalRequired: false, tenantScope: platform-scoped, toolNames: [identity_admin_tenants_read], restrictions: { subjectPolicy: authorized-subject, forbiddenInputs: [subjectId, actor] } }
    - { apiPermission: Identity.Tenants.Write, mcpPermission: identity.mcp.tenants.write, action: write, resource: tenants, audience: admin, risk: write, approvalRequired: false, tenantScope: platform-scoped, toolNames: [identity_admin_tenants_write], restrictions: { subjectPolicy: authorized-subject, forbiddenInputs: [subjectId, actor] } }
