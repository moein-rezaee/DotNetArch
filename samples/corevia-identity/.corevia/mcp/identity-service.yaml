schemaVersion: 0.1.0
kind: corevia.mcp-source-manifest
profile: service-mcp-adapter
standardRef: corevia-standards@0.1.0
sourceStatus: active
service:
  slug: identity-service
  repository: corevia-identity
  serviceRoot: .
  owner: IdentityService team
adapter:
  project: IdentityService.Mcp
  siblingOf: IdentityService.Api
  entrypoint: IdentityService.Mcp/Program.cs
applicationBoundary:
  allowedEntryPoints:
    - IdentityService.Application/MediatR handlers
    - IdentityService.Application/use-cases
    - IdentityService.Domain policies through Application
  forbiddenDependencies:
    - IdentityService.Api controllers
    - IdentityService HTTP API
    - API Gateway routes
    - Ocelot routes
    - EF Core
    - repositories
    - SQL
  transportIndependent: true
modes: [self, admin, security]
delegation:
  supported: true
  mode: signed-customer-context
  escalationForbidden: true
  requiredClaims: [type, actor, subject, tenant, audience, mode, issuedAt, expiresAt, allowedTools, allowedScopes, nonce, signature]
scopeNamespace: identity.mcp
scopes:
  - identity.mcp.profile.read
  - identity.mcp.profile.write
  - identity.mcp.sessions.read
  - identity.mcp.sessions-revoke.sensitive
  - identity.mcp.sessions-revoke-others.sensitive
  - identity.mcp.user-access-summary.read
  - identity.mcp.sessions-admin.sensitive
  - identity.mcp.users.read
  - identity.mcp.users.write
  - identity.mcp.users.sensitive
  - identity.mcp.roles.read
  - identity.mcp.roles.write
  - identity.mcp.roles.sensitive
  - identity.mcp.tenants.read
  - identity.mcp.tenants.write
  - identity.mcp.tenants.sensitive
  - identity.mcp.permissions.read
  - identity.mcp.permissions.write
  - identity.mcp.permissions.sensitive
  - identity.mcp.scopes.read
  - identity.mcp.scopes.write
  - identity.mcp.scopes.sensitive
  - identity.mcp.clients.read
  - identity.mcp.clients.write
  - identity.mcp.user-roles.read
  - identity.mcp.user-roles.sensitive
  - identity.mcp.user-tenants.read
  - identity.mcp.user-tenants.sensitive
  - identity.mcp.role-permissions.read
  - identity.mcp.role-permissions.sensitive
  - identity.mcp.scope-permissions.read
  - identity.mcp.scope-permissions.sensitive
  - identity.mcp.client-scopes.read
  - identity.mcp.client-scopes.sensitive
  - identity.mcp.role-users.read
  - identity.mcp.tenant-users.read
  - identity.mcp.protocol.refresh
  - identity.mcp.protocol.logout
  - identity.mcp.protocol.client-secrets.read
  - identity.mcp.protocol.client-secrets.write
  - identity.mcp.protocol.client-secrets.revoke
permissionParity:
  required: true
  apiPermissionSource: corevia-identity/.corevia/mcp/identity-api-permissions.yaml
  apiNamespace: Identity
  mcpNamespace: identity.mcp
  grantIsolation: explicit-mcp-grant
  apiGrantDoesNotImplyMcp: true
  requireUsableTool: true
  newApiPermissionPolicy: fail-closed
  orphanPolicy: fail
  sameRestrictionsRequired: true
  mappings:
    - { apiPermission: Identity.Profile.Get, mcpPermission: identity.mcp.profile.read, action: read, resource: profile, audience: self, risk: read, approvalRequired: false, tenantScope: current-user, toolNames: [identity_get_self_profile], restrictions: { subjectPolicy: current-context, forbiddenInputs: [userId, tenantId, subjectId, actor] } }
    - { apiPermission: Identity.Profile.Put, mcpPermission: identity.mcp.profile.write, action: write, resource: profile, audience: self, risk: write, approvalRequired: false, tenantScope: current-user, toolNames: [identity_update_self_profile], restrictions: { subjectPolicy: current-context, forbiddenInputs: [userId, tenantId, subjectId, actor] } }
    - { apiPermission: Identity.Sessions.Get, mcpPermission: identity.mcp.sessions.read, action: read, resource: sessions, audience: self, risk: read, approvalRequired: false, tenantScope: current-user, toolNames: [identity_list_self_sessions], restrictions: { subjectPolicy: current-context, forbiddenInputs: [userId, tenantId, subjectId, actor] } }
    - { apiPermission: Identity.Sessions.Revoke, mcpPermission: identity.mcp.sessions-revoke.sensitive, action: sensitive, resource: sessions-revoke, audience: self, risk: sensitive, approvalRequired: true, tenantScope: current-user, toolNames: [identity_revoke_self_session], restrictions: { subjectPolicy: current-context, forbiddenInputs: [userId, tenantId, subjectId, actor] } }
    - { apiPermission: Identity.Sessions.RevokeOthers, mcpPermission: identity.mcp.sessions-revoke-others.sensitive, action: sensitive, resource: sessions-revoke-others, audience: self, risk: sensitive, approvalRequired: true, tenantScope: current-user, toolNames: [identity_revoke_self_other_sessions], restrictions: { subjectPolicy: current-context, forbiddenInputs: [userId, tenantId, subjectId, actor] } }
    - { apiPermission: Identity.Users.AccessSummary.Get, mcpPermission: identity.mcp.user-access-summary.read, action: read, resource: user-access-summary, audience: admin, risk: read, approvalRequired: false, tenantScope: tenant-scoped, toolNames: [identity_get_user_access_summary], restrictions: { subjectPolicy: authorized-subject, forbiddenInputs: [subjectId, actor] } }
    - { apiPermission: Identity.Sessions.AdminRevoke, mcpPermission: identity.mcp.sessions-admin.sensitive, action: sensitive, resource: sessions-admin, audience: admin, risk: sensitive, approvalRequired: true, tenantScope: tenant-scoped, toolNames: [identity_revoke_user_sessions], restrictions: { subjectPolicy: authorized-subject, forbiddenInputs: [subjectId, actor, tenantId] } }
    - { apiPermission: Identity.Users.Read, mcpPermission: identity.mcp.users.read, action: read, resource: users, audience: admin, risk: read, approvalRequired: false, tenantScope: tenant-scoped, toolNames: [identity_admin_users_read], restrictions: { subjectPolicy: authorized-subject, forbiddenInputs: [subjectId, actor] } }
