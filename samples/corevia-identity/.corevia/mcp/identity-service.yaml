    version: 0.1.0
    status: active
    kind: atomic
    audience: self
    mcpPermission: identity.mcp.profile.read
    risk: read
    approvalRequired: false
    requiredScopes: [identity.mcp.profile.read]
    exposable: true
    subjectPolicy: current-context
    forbiddenInputs: [userId, tenantId, subjectId, actor]
    applicationBoundary:
      entryPoints: [IdentityService.Application/Features/Profile/Queries/GetProfile/GetProfileQuery]
      directDataAccess: false
    output:
      contract: IdentityService.Mcp/McpSelfProfileResult
      redaction: purpose-built-redacted
      forbiddenFields: [accessToken, refreshToken, clientSecret, otp, jwtSigningMaterial, databaseCredential]
