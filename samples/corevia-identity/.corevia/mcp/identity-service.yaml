transports:
  default: http
  stdioDevelopmentOnly: true
  profiles: [local-stdio, local-loopback-http, customer-server-https, customer-private-http, managed-connector]
  localLoopback:
    enabled: true
    allowedBindAddresses: [127.0.0.1, '::1']
    authenticationRequired: true
    publicForwardingForbidden: true
    hostOriginValidation: true
  customerServer:
    httpsRequiredForPublic: true
    privateNetworkEquivalentAllowed: true
  gatewayDependency:
    current: none
    futureOptional: true
    relay: outbound-secure-connector
  cloudClient:
    localConnectorRequired: true
    directOfflineAccess: false
    consentAndEgressPolicyRequired: true
authorization:
  actorSource: validated-authentication-context
  subjectSource: [server-resolved-self, server-resolved-admin, signed-delegation-context]
  promptAuthorizationForbidden: true
  enforcementLayers: [authentication, authorization, tool-policy, application-domain-policy, audit]
audit:
  required: true
  fields: [actor, subject, tenant, mode, tool-name, tool-version, required-scopes, effective-scopes, authorization-decision, approval-id, approval-status, result-status, correlation-id]
  rawSecretsForbidden: true
redaction:
  required: true
  forbiddenOutputs: [access-token, refresh-token, client-secret, otp-code, jwt-signing-material, database-credential, private-key, unredacted-sensitive-payload]
  rawPayloadsForbidden: true
migration:
  pattern: mcp-source.migrate-or-adopt
  state: verified
  compatibilityRequired: true
  rollbackRequired: true
tests:
  genericAcceptance: [A01, A02, A03, A04, A05, A06, A07, A08, A09, A10, A11, A12, A13, A14, A15, A16]
  securityNegative: true
  serviceSpecific:
    - identity-mcp-sibling-boundary
    - identity-mcp-api-mcp-permission-parity
    - identity-mcp-active-permission-tool-usability
    - identity-mcp-self-authorization
    - identity-mcp-admin-tenant-boundary
    - identity-mcp-delegation
    - identity-mcp-tool-allowlist
    - identity-mcp-sensitive-approval
    - identity-mcp-redaction
    - identity-mcp-local-and-customer-server-transport
evidence:
  required: [source-inventory, api-permission-catalog, permission-parity-matrix, manifest-validation, tool-policy-matrix, security-negative-tests, transport-tests, redacted-audit-review]
  redacted: true
  implementationStatus: verified
