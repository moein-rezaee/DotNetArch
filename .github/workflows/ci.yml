name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build (warnings are errors)
        run: dotnet build DotNetArch.sln --configuration Release
      - name: Unit tests
        run: dotnet test DotNetArch.sln --configuration Release --no-build --filter "Category!=Integration"

  smoke:
    name: Smoke (generate and build a solution)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: git config --global user.email "ci@example.com" && git config --global user.name "ci"
      - run: scripts/smoke.sh

  pack:
    name: Pack tool
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet pack src/DotNetArch.Cli/DotNetArch.Cli.csproj --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*
